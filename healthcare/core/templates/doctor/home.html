{% extends 'doctor/base.html' %} 
{% block body %}

<div class="mb-4">
    <h2>Welcome, Dr. {{ user.username }}</h2>
    <p>Here is your daily clinical overview.</p>
</div>

<div class="grid grid-cols-2 gap-4">
    <!-- Card 1 -->
    <div class="card flex items-center justify-between" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%); border-color: rgba(16, 185, 129, 0.2);">
        <div>
            <p style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: var(--success); margin-bottom: 0.5rem;">Total Prescriptions</p>
            <h3 style="font-size: 2.5rem; margin: 0; color: var(--text-main);">{{ drug }}</h3>
        </div>
        <div style="font-size: 3rem; color: var(--success); opacity: 0.2;">
            <i class="fa-solid fa-pills"></i>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="card flex items-center justify-between" style="background: linear-gradient(135deg, rgba(10, 102, 194, 0.1) 0%, rgba(10, 102, 194, 0.05) 100%); border-color: rgba(10, 102, 194, 0.2);">
        <div>
            <p style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem;">Registered Patients</p>
            <h3 style="font-size: 2.5rem; margin: 0; color: var(--text-main);">{{ patient }}</h3>
        </div>
        <div style="font-size: 3rem; color: var(--primary); opacity: 0.2;">
            <i class="fa-solid fa-users"></i>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="card flex items-center justify-between" style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%); border-color: rgba(245, 158, 11, 0.2);">
        <div>
            <p style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: #F59E0B; margin-bottom: 0.5rem;">Appointments Made</p>
            <h3 style="font-size: 2.5rem; margin: 0; color: var(--text-main);">{{ ment }}</h3>
        </div>
        <div style="font-size: 3rem; color: #F59E0B; opacity: 0.2;">
            <i class="fa-solid fa-calendar-check"></i>
        </div>
    </div>

    <!-- Card 4 -->
    <div class="card flex items-center justify-between" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(99, 102, 241, 0.05) 100%); border-color: rgba(99, 102, 241, 0.2);">
        <div>
            <p style="text-transform: uppercase; font-size: 0.8rem; font-weight: 700; color: var(--secondary); margin-bottom: 0.5rem;">Active Doctors</p>
            <h3 style="font-size: 2.5rem; margin: 0; color: var(--text-main);">{{ doctor }}</h3>
        </div>
        <div style="font-size: 3rem; color: var(--secondary); opacity: 0.2;">
            <i class="fa-solid fa-user-doctor"></i>
        </div>
    </div>
</div>

{% endblock %}
