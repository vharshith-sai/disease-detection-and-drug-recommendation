{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - HealthTech</title>
    <!-- Icons -->
    <link rel="stylesheet" href="{% static 'core/vendors/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Modern Redesign CSS -->
    <link rel="stylesheet" href="{% static 'core/css/redesign.css' %}">
</head>
<body>

<div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="mb-4">
            <a href="/" class="brand-logo">
                <i class="fa-solid fa-heart-pulse"></i> <span>Health</span>Tech
            </a>
        </div>
        
        <div style="padding: 1rem; background: var(--surface-hover); border-radius: var(--radius-md); margin-bottom: 2rem;">
            <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Doctor Profile</p>
            <h4 style="margin: 0; padding-top: 0.2rem; color: var(--primary);">Dr. {{ user.username }}</h4>
        </div>

        <nav class="sidebar-nav">
            <a class="sidebar-link" href="{% url 'doctor' %}">
                <i class="fa-solid fa-user-doctor" style="width: 24px;"></i> Dashboard Overview
            </a>
            <a class="sidebar-link" href="{% url 'commend' %}">
                <i class="fa-solid fa-pills" style="width: 24px;"></i> Prescribe Drugs
            </a>
            <a class="sidebar-link" href="{% url 'meet_list' %}">
                <i class="fa-regular fa-calendar-check" style="width: 24px;"></i> Appointments
            </a>
        </nav>

        <div style="margin-top: auto;">
            <a class="btn btn-secondary" href="{% url 'logout' %}" style="width: 100%; border-color: var(--danger); color: var(--danger);">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-content">
        {% block body %}{% endblock %}
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Scripts - Preserved for existing Functionality -->
<script src="{% static 'core/js/jquery.js' %}"></script>
<script src="{% static 'core/js/popper.js' %}"></script>
{% include 'doctor/ajax.html' %} 
{% block javascript %}{% endblock %}

</body>
</html>
