{% extends 'patient/base.html' %} 
{% load static %} 
{% block body %}

<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="mb-4">
        <h2>AI Disease Prediction</h2>
        <p>Enter your top 5 symptoms below, and our model will analyze them instantly.</p>
    </div>

    <form method="POST" action="" class="myform">
        {% csrf_token %}
        <input type="hidden" value="{{ user.id }}" name="" id="user_id" />
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="form-group">
                <label for="Symptom1">Primary Symptom</label>
                <input type="text" class="form-control" list="symp" name="Symptom1" id="Symptom1" placeholder="Search symptom..." required />
            </div>
            <div class="form-group">
                <label for="Symptom2">Secondary Symptom</label>
                <input type="text" class="form-control" list="symp" name="Symptom2" id="Symptom2" placeholder="Search symptom..." required />
            </div>
            <div class="form-group">
                <label for="Symptom3">Third Symptom</label>
                <input type="text" class="form-control" list="symp" name="Symptom3" id="Symptom3" placeholder="Search symptom..." required />
            </div>
            <div class="form-group">
                <label for="Symptom4">Fourth Symptom</label>
                <input type="text" class="form-control" list="symp" id="Symptom4" name="Symptom4" placeholder="Search symptom..." required />
            </div>
            <div class="form-group">
                <label for="Symptom5">Fifth Symptom</label>
                <input type="text" class="form-control" list="symp" id="Symptom5" name="Symptom5" placeholder="Search symptom..." required />
            </div>
        </div>

        <datalist id="symp">
            {% for symp in symptoms %}
            <option value="{{symp}}">{{symp}}</option>
            {% endfor %}
        </datalist>

        <div class="flex items-center gap-2 mt-4 pt-4" style="border-top: 1px solid var(--border);">
            <button type="button" class="btn btn-primary" id="predict_btn">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Run AI Diagnosis
            </button>
        </div>

        <!-- The #result div requires specific ID for jQuery injection -->
        <div id="result" class="mt-4" style="font-size: 1.1rem; font-weight: 600; color: var(--primary);"></div>
    </form>
</div>

{% endblock %}
