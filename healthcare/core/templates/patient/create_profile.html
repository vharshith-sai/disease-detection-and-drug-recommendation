{% extends 'patient/base.html' %} 
{% block body %}

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="mb-4 text-center">
        <div style="width: 80px; height: 80px; background: var(--surface-hover); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary);">
            <i class="fa-solid fa-user-pen"></i>
        </div>
        <h2>Complete Your Profile</h2>
        <p>Before proceeding, we need a few more details to calibrate your health platform.</p>
    </div>

    <form method="POST" action="">
        {% csrf_token %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    <i class="fa-solid fa-check-circle" style="margin-right: 8px;"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="form-group">
            <label for="start">Date of Birth</label>
            <input type="date" id="start" min="1950-01-01" class="form-control" name="birth_date" placeholder="Birth Date" required="required">
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select class="form-control" name="gender" id="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" class="form-control" name="country" id="country" placeholder="Enter Country" required="required">
            </div>
            <div class="form-group">
                <label for="region">Region / State</label>
                <input type="text" class="form-control" name="region" id="region" placeholder="Enter Region" required="required">
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-4" style="width: 100%; padding: 1rem;">
            Save Profile <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
    </form>
</div>

{% endblock %}
