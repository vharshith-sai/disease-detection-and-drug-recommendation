{% extends 'base.html' %}
{% block body %}
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="text-center mb-4">
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="margin-bottom: 0;">Sign in to access your dashboard</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">
                    <i class="fa-solid fa-circle-exclamation" style="margin-right: 8px;"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required name="username">
            </div>

            <div class="form-group mb-4">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required name="password">
            </div>

            <button type="submit" id="login_btn" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">
                <i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Secure Login
            </button>
        </form>

        <div class="text-center mt-4" style="font-size: 0.9rem;">
            <p>Don't have an account? <a href="{% url 'reg' %}" style="font-weight: 600;">Create one now</a></p>
        </div>
    </div>
</div>
{% endblock %}
