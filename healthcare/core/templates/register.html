{% extends 'base.html' %}
{% block body %}
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="text-center mb-4">
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Join HealthTech</h2>
            <p style="margin-bottom: 0;">Create a patient account to manage your health</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'reg_user' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" name="username" id="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group mb-4">
                <label for="password">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="Choose a strong password" required>
            </div>

            <button type="submit" id="reg_btn" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">
                <i class="fa-solid fa-user-plus" style="margin-right: 8px;"></i> Create Account
            </button>
        </form>

        <div class="text-center mt-4" style="font-size: 0.9rem;">
            <p>Already have an account? <a href="{% url 'login' %}" style="font-weight: 600;">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
