{% extends 'base.html' %} 
{% block body %}

<section style="padding: 6rem 0; background: var(--background);">
    <div class="container text-center mb-8">
        <h2>Our Medical Specialists</h2>
        <p style="max-width: 600px; margin: 0 auto;">Connect with our experienced doctors for professional consultations and validated AI-assisted diagnostics.</p>
    </div>

    <div class="container">
        <div class="grid grid-cols-3 gap-4">
            <!-- Doctor 1 -->
            <div class="card text-center">
                <div style="width: 120px; height: 120px; background: linear-gradient(135deg, #E0E7FF, var(--surface)); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--secondary);">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <h3>Dr. Saim</h3>
                <p style="color: var(--primary); font-weight: 600;">Cardiologist</p>
                <div class="flex justify-center gap-2 mt-4" style="border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <a href="#" class="btn btn-secondary" style="padding: 0.5rem 1rem;"><i class="fa-solid fa-phone"></i> Contact</a>
                </div>
            </div>

            <!-- Doctor 2 -->
            <div class="card text-center">
                <div style="width: 120px; height: 120px; background: linear-gradient(135deg, #ECFDF5, var(--surface)); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--success);">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <h3>Dr. Moazam</h3>
                <p style="color: var(--primary); font-weight: 600;">ENT Specialist</p>
                <div class="flex justify-center gap-2 mt-4" style="border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <a href="#" class="btn btn-secondary" style="padding: 0.5rem 1rem;"><i class="fa-solid fa-phone"></i> Contact</a>
                </div>
            </div>

            <!-- Doctor 3 -->
            <div class="card text-center">
                <div style="width: 120px; height: 120px; background: linear-gradient(135deg, #FEF3C7, var(--surface)); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #F59E0B;">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <h3>Dr. Shahid</h3>
                <p style="color: var(--primary); font-weight: 600;">Eye Specialist</p>
                <div class="flex justify-center gap-2 mt-4" style="border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <a href="#" class="btn btn-secondary" style="padding: 0.5rem 1rem;"><i class="fa-solid fa-phone"></i> Contact</a>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
